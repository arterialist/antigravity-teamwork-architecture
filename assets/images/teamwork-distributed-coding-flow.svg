<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1154 320" width="100%" height="100%" style="display:block;background:#ffffff;font-family:'Google Sans',system-ui,-apple-system,sans-serif;">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <marker id="arrGray" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#64748B"/>
    </marker>
    <marker id="arrAmber" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#D97706"/>
    </marker>
    <marker id="arrRed" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#DC2626"/>
    </marker>
    <marker id="arrBlue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#2563EB"/>
    </marker>
    <marker id="arrTeal" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#0D9488"/>
    </marker>
  </defs>

  <!-- Outer Card Container -->
  <rect x="8" y="8" width="1138" height="304" rx="16" fill="#F8F9FA" stroke="#E8EAED" stroke-width="1.5"/>

  <!-- ==================== FORWARD ARROWS ==================== -->
  <g stroke-width="2" fill="none">
    <!-- Objective -> Sentinel -->
    <line x1="126" y1="100" x2="144" y2="100" stroke="#6366F1" marker-end="url(#arrBlue)"/>
    <!-- Sentinel -> Orchestrator -->
    <line x1="266" y1="100" x2="284" y2="100" stroke="#0D9488" marker-end="url(#arrTeal)"/>
    <!-- Orchestrator -> Explorer (fan out 3 arrows) -->
    <path d="M 406 85 L 440 68" stroke="#3B82F6" marker-end="url(#arrBlue)"/>
    <path d="M 406 100 L 440 100" stroke="#3B82F6" marker-end="url(#arrBlue)"/>
    <path d="M 406 115 L 440 132" stroke="#3B82F6" marker-end="url(#arrBlue)"/>
    <!-- Explorer -> Worker -->
    <line x1="578" y1="100" x2="602" y2="100" stroke="#059669" marker-end="url(#arrTeal)"/>
    <!-- Worker -> Critic -->
    <line x1="738" y1="100" x2="762" y2="100" stroke="#F59E0B" marker-end="url(#arrAmber)"/>
    <!-- Critic -> Verifier -->
    <line x1="886" y1="100" x2="910" y2="100" stroke="#059669" marker-end="url(#arrTeal)"/>
    <!-- Verifier -> Done -->
    <line x1="1034" y1="100" x2="1062" y2="100" stroke="#059669" marker-end="url(#arrTeal)"/>
  </g>

  <!-- ==================== FEEDBACK LOOPS ==================== -->
  <!-- Ralph Loop (Critic -> Orchestrator) -->
  <g>
    <path d="M 824 165 C 824 235, 345 235, 345 165" fill="none" stroke="#D97706" stroke-width="1.8" marker-end="url(#arrAmber)"/>
    <rect x="489" y="201" width="190" height="34" rx="17" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text x="584" y="216" text-anchor="middle" fill="#D97706" font-size="11.5" font-weight="700">Ralph Loop</text>
    <text x="584" y="229" text-anchor="middle" fill="#B45309" font-size="9.5">↻ Iterate until converge</text>
  </g>

  <!-- Rejection Loop (Verifier -> Sentinel) -->
  <g fill="none">
    <path d="M 972 165 C 972 275, 206 275, 206 165" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrRed)"/>
    <text x="584" y="278" text-anchor="middle" fill="#DC2626" font-size="11.5" font-weight="600">Result Rejected → back to Sentinel → Orchestrator</text>
  </g>

  <!-- ==================== NODES ==================== -->

  <!-- 1. Objective (x=20) -->
  <g transform="translate(20, 35)">
    <rect width="106" height="126" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#cardShadow)"/>
    <rect width="106" height="34" rx="10" fill="#6366F1"/>
    <rect y="24" width="106" height="10" fill="#6366F1"/>
    <text x="53" y="22" text-anchor="middle" fill="#FFFFFF" font-size="12.5" font-weight="700">🎯 Objective</text>
    <text x="53" y="75" text-anchor="middle" fill="#1E293B" font-size="11" font-weight="500">Human sets the</text>
    <text x="53" y="93" text-anchor="middle" fill="#1E293B" font-size="11" font-weight="500">goal</text>
  </g>

  <!-- 2. Sentinel (x=150) -->
  <g transform="translate(150, 35)">
    <rect width="116" height="126" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#cardShadow)"/>
    <rect width="116" height="34" rx="10" fill="#0D9488"/>
    <rect y="24" width="116" height="10" fill="#0D9488"/>
    <text x="58" y="22" text-anchor="middle" fill="#FFFFFF" font-size="12.5" font-weight="700">🛡️ Sentinel</text>
    <text x="58" y="72" text-anchor="middle" fill="#0F172A" font-size="11.5" font-weight="700">Always active</text>
    <text x="58" y="94" text-anchor="middle" fill="#475569" font-size="10.5">Restarts orchestrators</text>
  </g>

  <!-- 3. Orchestrator (x=290) -->
  <g transform="translate(290, 35)">
    <!-- Stacked layer behind -->
    <rect x="8" y="-6" width="116" height="126" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1"/>
    <rect width="116" height="126" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#cardShadow)"/>
    <rect width="116" height="34" rx="10" fill="#8B5CF6"/>
    <rect y="24" width="116" height="10" fill="#8B5CF6"/>
    <text x="58" y="22" text-anchor="middle" fill="#FFFFFF" font-size="12.5" font-weight="700">🧠 Orchestrator</text>
    <text x="58" y="72" text-anchor="middle" fill="#0F172A" font-size="11">Decomposes task,</text>
    <text x="58" y="92" text-anchor="middle" fill="#475569" font-size="10.5">Self-succession</text>
  </g>

  <!-- 4. Explorer (x=446, stacked 3 layers) -->
  <g transform="translate(446, 35)">
    <rect x="12" y="-12" width="120" height="126" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
    <rect x="6" y="-6" width="120" height="126" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <rect width="120" height="126" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#cardShadow)"/>
    <rect width="120" height="34" rx="10" fill="#2563EB"/>
    <rect y="24" width="120" height="10" fill="#2563EB"/>
    <text x="60" y="22" text-anchor="middle" fill="#FFFFFF" font-size="12.5" font-weight="700">🔭 Explorer</text>
    <text x="60" y="68" text-anchor="middle" fill="#0F172A" font-size="11">Strategy generation</text>
    <text x="60" y="88" text-anchor="middle" fill="#475569" font-size="10.5">Diverse solution</text>
    <text x="60" y="104" text-anchor="middle" fill="#475569" font-size="10.5">paths</text>
  </g>

  <!-- 5. Worker (x=608, stacked) -->
  <g transform="translate(608, 35)">
    <rect x="8" y="-6" width="120" height="126" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
    <rect width="120" height="126" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#cardShadow)"/>
    <rect width="120" height="34" rx="10" fill="#2563EB"/>
    <rect y="24" width="120" height="10" fill="#2563EB"/>
    <text x="60" y="22" text-anchor="middle" fill="#FFFFFF" font-size="12.5" font-weight="700">⚙️ Worker</text>
    <text x="60" y="70" text-anchor="middle" fill="#0F172A" font-size="11">Isolated branch</text>
    <text x="60" y="90" text-anchor="middle" fill="#475569" font-size="10.5">Parallel execution</text>
  </g>

  <!-- 6. Critic (x=768) -->
  <g transform="translate(768, 35)">
    <rect width="118" height="126" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#cardShadow)"/>
    <rect width="118" height="34" rx="10" fill="#F59E0B"/>
    <rect y="24" width="118" height="10" fill="#F59E0B"/>
    <text x="59" y="22" text-anchor="middle" fill="#FFFFFF" font-size="12.5" font-weight="700">🔍 Critic</text>
    <text x="59" y="70" text-anchor="middle" fill="#0F172A" font-size="11">Reviews quality</text>
    <text x="59" y="90" text-anchor="middle" fill="#475569" font-size="10.5">Requests revisions</text>
  </g>

  <!-- 7. Verifier (x=916) -->
  <g transform="translate(916, 35)">
    <rect width="118" height="126" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#cardShadow)"/>
    <rect width="118" height="34" rx="10" fill="#059669"/>
    <rect y="24" width="118" height="10" fill="#059669"/>
    <text x="59" y="22" text-anchor="middle" fill="#FFFFFF" font-size="12.5" font-weight="700">✅ Verifier</text>
    <text x="59" y="70" text-anchor="middle" fill="#0F172A" font-size="11">build/test</text>
    <text x="59" y="90" text-anchor="middle" fill="#475569" font-size="10.5">Independent auditor</text>
  </g>

  <!-- 8. Done (x=1068) -->
  <g transform="translate(1068, 65)">
    <rect width="66" height="66" rx="10" fill="#059669" filter="url(#cardShadow)"/>
    <text x="33" y="32" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">✓</text>
    <text x="33" y="52" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">Done</text>
  </g>
</svg>